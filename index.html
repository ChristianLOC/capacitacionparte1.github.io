// ===== LÓGICA DE LA APLICACIÓN =====
const $=s=>document.querySelector(s),N=T.length+2,sh=a=>a.sort(()=>Math.random()-.5);
let i=0,qs=[],qi=0,sc=0,sel=null,cur=0;

function mode(m){
  $("#P").hidden=m!="p";
  $("#Q").hidden=m!="q";
  $("#tp").setAttribute("aria-selected",m=="p");
  $("#tq").setAttribute("aria-selected",m=="q");
}

function go(n){
  i=Math.max(0,Math.min(N-1,n));
  mode("p");
  let h="";
  if(i==0){
    h=`<h1 class="big">Revolución de la inteligencia artificial</h1><p class="sub">Jóvenes creadores de soluciones y líderes de la transformación digital en Panamá. Concurso Nacional de Oratoria 2026.</p><p>Apuntes ordenados por tema (temas 1 a 18) y un quiz de 5 preguntas al azar por tema para comprobar lo que sé.</p><button class="btn p" onclick="go(1)">Ver temas</button> <button class="btn" onclick="startQ(0)">Empezar quiz</button>`;
  }else if(i==1){
    h=`<h2>Temas</h2><div class="grid">${T.map((t,k)=>`<button onclick="go(${k+2})"><b>${t.n}</b><span>${t.t}</span></button>`).join("")}</div><h3>Pendiente por investigar</h3><ul>${P.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  }else{
    const t=T[i-2];
    h=`<div class="hd"><div class="num">${t.n}</div><div><h2>${t.t}</h2><p class="sub">${t.s}</p></div></div><blockquote>${t.k}</blockquote>${t.g.map(g=>`<h3>${g[0]}</h3><ul>${g[1].map(x=>`<li>${x}</li>`).join("")}</ul>`).join("")}<p><button class="btn" onclick="startQ(${t.n})">Practicar este tema (5 al azar de 12)</button></p>`;
  }
  $("#slide").innerHTML=h;
  $("#cnt").textContent=(i+1)+" / "+N;
  $("#pv").disabled=i==0;
  $("#nx").disabled=i==N-1;
  scrollTo(0,0);
}

function startQ(n){
  cur=+n||0;
  mode("q");
  const pool = Q.filter(q=>!cur||q[0]==cur);
  const seleccion = sh([...pool]).slice(0,5);
  qs = seleccion.map(q=>({t:q[0],q:q[1],a:q[2],o:sh(q.slice(2,6)),e:q[6]}));
  qi=0;sc=0;sel=null;dq();
}

function dq(){
  const f=`<p><label>Tema: <select onchange="startQ(this.value)"><option value="0">Todos (216 preguntas)</option>${T.filter(t=>Q.some(q=>q[0]==t.n)).map(t=>`<option value="${t.n}" ${t.n==cur?"selected":""}>${t.n}. ${t.t} (12 preguntas)</option>`).join("")}</select></label></p>`;
  if(qi>=qs.length){
    const p=Math.round(100*sc/qs.length);
    $("#quiz").innerHTML=f+`<h2>${sc} de ${qs.length} (${p} %)</h2><p>${p>=80?"Excelente dominio del tema. Estás listo para el concurso.":"Repasa los temas y vuelve a intentarlo. Concéntrate en los que fallaste."}</p><button class="btn p" onclick="startQ(${cur})">Repetir</button> <button class="btn" onclick="go(1)">Volver a los temas</button>`;
    return;
  }
  const q=qs[qi];
  $("#quiz").innerHTML=f+`<p class="sub">Tema ${q.t}. Pregunta ${qi+1} de ${qs.length}</p><p class="qtext">${q.q}</p>`+q.o.map((o,k)=>`<button class="o ${sel===null?"":o==q.a?"g":k==sel?"b":""}" onclick="pk(${k})">${o}</button>`).join("")+(sel===null?"":`<p class="ex"><b>${q.o[sel]==q.a?"Correcto.":"Respuesta: "+q.a}</b> ${q.e}</p><button class="btn p" onclick="qi++;sel=null;dq()">Siguiente</button>`);
}

function pk(k){
  if(sel!==null)return;
  sel=k;
  if(qs[qi].o[k]==qs[qi].a)sc++;
  dq();
}

document.addEventListener("keydown",e=>{
  if($("#P").hidden)return;
  if(e.key=="ArrowRight")go(i+1);
  if(e.key=="ArrowLeft")go(i-1);
});

go(0);
</script></body></html>
